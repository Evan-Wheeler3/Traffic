<title>Rainline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>

#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); }

  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;

.brand b { color: var(--neon); font-weight: 700; text-shadow: 0 0 10px rgba(255, 179, 71, 0.7); }
.brand span { color: var(--dim); }
.stats { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 4px; }
.stats b { color: var(--neon); font-size: 15px; letter-spacing: 0.08em; text-shadow: 0 0 10px rgba(255, 179, 71, 0.6); }
.toast {

  max-width: calc(100% - 32px); padding: 10px 14px; background: var(--panel); border: 1px solid var(--neon);
  color: var(--ink); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; text-align: center;

.hud-bottom {

}

.hint { font-size: 10px; color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; text-align: center; }
</style>

<canvas id="view" aria-label="ASCII isometric road sandbox at night in the rain. Drag to draw roads; cars drive on them."></canvas>
<div class="hud-top">
  <div class="brand"><b>RAINLINE</b></div>
  <div class="stats"><b id="money">$0</b><span id="stats">booting</span></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="hud-bottom">
  <div class="bar">
    <button id="bMode" type="button" aria-pressed="true">draw</button>
    <button id="bUndo" type="button">undo</button>
    <button id="bClear" type="button">clear</button>
    <button id="bRain" type="button">rain <span class="v" id="vRain">heavy</span></button>
    <button id="bTraffic" type="button">cars <span class="v" id="vTraffic">normal</span></button>
    <button id="bCrash" type="button">crash</button>
  </div>
  <div class="hint" id="hint">drag to draw a road · two fingers to pan &amp; zoom</div>
</div>

    put(cc, rr_ - roofUp, front || back ? CH.eq : CH.hash, front || back ? glass : hi, c.col, 0.08 * fade);
  }
  if (c.kind === 'taxi') { const [cc, rr_] = cellOf(c.x, c.y); put(cc, rr_ - roofUp - 1, CH.caret, [1, 0.85, 0.4], [1, 0.8, 0.3], 0.9 * fade); }
  // lamps on the corners
  const hk = (0.6 + 1.2 * Math.max(0, tow)) * fade, tk = (c.brake ? 1.6 : 0.6) * (0.7 + 0.5 * Math.max(0, -tow)) * fade;
  const haz = c.hazard && blinkOn(c.id, 9);
  let hc = null, tc = null;
  for (const sd of [-1, 1]) {
    hc = cellOf(c.x + hx * L / 2 + rxv * sd * Wd * 0.34, c.y + hy * L / 2 + ryv * sd * Wd * 0.34);
    tc = cellOf(c.x - hx * L / 2 + rxv * sd * Wd * 0.34, c.y - hy * L / 2 + ryv * sd * Wd * 0.34);
    put(hc[0], hc[1], CH.o, [0.9, 0.9, 0.85], haz ? LC.amber : LC.head, haz ? 1.4 : hk);
    put(tc[0], tc[1], c.brake ? CH.O : CH.o, [0.8, 0.2, 0.15], haz ? LC.amber : LC.tail, haz ? 1.4 : tk);
  }
  if (haz) poolInto(litA, c.x, c.y, 3.5, LC.amber, 0.7);
  // light cast onto the road
  const fx = c.x + hx * L / 2, fy = c.y + hy * L / 2, bx = c.x - hx * L / 2, by = c.y - hy * L / 2;
  coneInto(litA, fx, fy, hx, hy, 10, LC.head, 1.15 * fade);
  poolInto(litA, bx - hx * 0.6, by - hy * 0.6, c.brake ? 3 : 2.2, LC.tail, (c.brake ? 0.9 : 0.4) * fade);
  refl.push([hc[0], hc[1], LC.head, 0.9 * Math.max(0, tow) * fade]);
  refl.push([tc[0], tc[1], LC.tail, (c.brake ? 0.9 : 0.4) * fade]);
  if (c.cop && c.siren) { poolInto(litA, c.x, c.y, 8, bar, 1.1 * fade); const m = cellOf(c.x, c.y); refl.push([m[0], m[1], bar, 1.0 * fade]); }
}

// ================================================================ rain
let drops = [], splashes = [], flash = 0, flashQ = 0;
const WIND = 0.08;
function setRain() {
  const target = Math.round(NC * WEATHER[wi].rain * 0.55 * (REDUCED ? 0.4 : 1));
  while (drops.length < target) drops.push({ c: rnd() * (cols + 20) - 10, r: rnd() * rows, v: rr(650, 1050) / ch, len: 2 + ((rnd() * 4) | 0) });
  drops.length = target;
}
function updateRain(dt) {
  for (const d of drops) {
    d.r += d.v * dt; d.c += d.v * dt * WIND * (ch / cw);
    if (d.r > rows + 6) { d.r = -1 - rnd() * 8; d.c = rnd() * (cols + 20) - 10; d.v = rr(650, 1050) / ch; }
  }
  let n = NC * WEATHER[wi].rain * 0.6 * dt;
  while (n > 0) { if (rnd() < n) splashes.push({ c: (rnd() * cols) | 0, r: (rnd() * rows) | 0, t: 0 }); n -= 1; }
  for (let i = splashes.length - 1; i >= 0; i--) { splashes[i].t += dt; if (splashes[i].t > 0.3) splashes.splice(i, 1); }
}

// ================================================================ frame
let last = performance.now(), fpsS = 60, statT = 0, nextWave = 8, saveT = 5;
const statsEl = document.getElementById('stats'), moneyEl = document.getElementById('money'), hintEl = document.getElementById('hint');
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fpsS += (1 / Math.max(dt, 1e-3) - fpsS) * 0.05;
  simT += dt;

  // ---- simulation
  updateDemand(dt);
  nextPlace -= dt;
  if (nextPlace <= 0) { nextPlace = rr(55, 100); if (places.filter(p => !p.connected).length < 2) spawnPlace(); }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.style.opacity = 0; }
  saveT -= dt; if (saveT <= 0) { saveT = 5; save(); }
  nextWave -= dt;
  if (nextWave <= 0) { nextWave = rr(7, 14); const fast = cars.filter(c => c.v > 5 && c.path.kind === 'lane'); if (fast.length) pick(fast).brakeT = rr(0.8, 1.4); }
  updateCars(dt);
  updateIncidents(dt);
  updateRain(dt);
  if (WEATHER[wi].name === 'storm' && !REDUCED && rnd() < dt * 0.06) { flash = 1; flashQ = 0.14; }
  if (flashQ > 0) { flashQ -= dt; if (flashQ <= 0) flash = 0.8; }
  flash = Math.max(0, flash - dt * 4);

  // ---- base layer (roads, lamps); rebuilt when the camera or the roads change
  if (stroke) baseDirty = true;
  if (baseDirty) rebuildBase();

  // ---- per-frame cells
  chA.set(baseCh); albA.set(baseAlb); emA.set(baseEm);
  const ak = WEATHER[wi].amb, ar = 0.22 * ak + flash * 0.9, ag = 0.27 * ak + flash * 0.95, ab = 0.4 * ak + flash;
  for (let i = 0; i < NC; i++) { litA[i * 3] = ar + baseLit[i * 3]; litA[i * 3 + 1] = ag + baseLit[i * 3 + 1]; litA[i * 3 + 2] = ab + baseLit[i * 3 + 2]; }
  refl.length = 0;
  // signals
  for (const s of sigHeads) {
    const col = sigCol(sigState(s.node, s.lane.phase)), [c, r] = cellOf(s.x, s.y);
    const pr = Math.max(2, Math.round(2.3 * THp / ch));
    for (let k = 0; k < pr; k++) put(c, r - k, CH.bar, AL.pole);
    put(c - 1, r - pr, C('['), AL.pole); put(c + 1, r - pr, C(']'), AL.pole);
    put(c, r - pr, CH.O, [0.5, 0.5, 0.5], col, 2.0);
    poolInto(litA, s.sx, s.sy, 3, col, 0.65);
    refl.push([c, r, col, 0.6]);
  }
  // cars (paint back-to-front so nearer cars win overlapping cells)
  cars.sort((a, b) => (a.x + a.y) - (b.x + b.y));
  for (const c of cars) drawCar(c);
  // road flares at incidents
  for (const inc of incidents) for (const f of inc.flares) {
    const fl = 0.7 + 0.3 * Math.sin(simT * 23 + f.ph) * Math.sin(simT * 7 + f.ph), [c, r] = cellOf(f.x, f.y);
    put(c, r, CH.star, [0.9, 0.4, 0.3], LC.flare, 1.6 * fl);
    poolInto(litA, f.x, f.y, 3.4, LC.flare, 0.8 * fl);
    refl.push([c, r, LC.flare, 0.7 * fl]);
  }
  // paving sparkle behind the finger
  if (stroke) {
    const n = stroke.pts.length;
    for (let k = Math.max(0, n - 14); k < n; k++) {
      const age = simT - stroke.t[k]; if (age > 0.7) continue;
      const p = stroke.pts[k], a = 1 - age / 0.7;
      for (let j = 0; j < 16; j++) {
        const ang = rnd() * TAU, rad = rnd() * HW, [c, r] = cellOf(p[0] + Math.cos(ang) * rad, p[1] + Math.sin(ang) * rad);
        put(c, r, pick([CH.star, CH.plus, CH.x, CH.dot]), [0.6, 0.9, 1], [0.45, 0.85, 1], 1.4 * a);
      }
      poolInto(litA, p[0], p[1], 4, [0.4, 0.8, 1], 0.5 * a);
    }
    const tip = stroke.pts[n - 1], [c, r] = cellOf(tip[0], tip[1]);
    put(c, r, CH.plus, [1, 1, 1], stroke.broke ? LC.red : [0.7, 0.95, 1], 2.2);
  }
  for (const [c, r, col, I] of refl) if (I > 0.02) reflectInto(litA, c, r, col, I, false);
  // rain (lit by whatever light the cell already has)
  const slant = WIND * (ch / cw);
  for (const d of drops) for (let k = 0; k < d.len; k++) {
    const k2 = 1 - k / d.len;
    put(Math.floor(d.c - k * slant), Math.floor(d.r) - k, k === 0 ? CH.bar : CH.apos, [AL.rain[0] * k2, AL.rain[1] * k2, AL.rain[2] * k2]);
  }
  for (const s of splashes) if (s.r < rows && s.c < cols && isRoad[s.r * cols + s.c]) put(s.c, s.r, s.t < 0.1 ? CH.dot : s.t < 0.2 ? CH.o : CH.deg, AL.splash);
  drawGameLayer(dt);

  // ---- resolve colour per cell
  const cd = colorImg.data, gd = glowImg.data;
  for (let i = 0; i < NC; i++) {
    const j = i * 3, o = i * 4;
    const r = albA[j] * litA[j] + emA[j], g = albA[j + 1] * litA[j + 1] + emA[j + 1], b = albA[j + 2] * litA[j + 2] + emA[j + 2];
    cd[o] = 255 * (1 - Math.exp(-1.9 * r)); cd[o + 1] = 255 * (1 - Math.exp(-1.9 * g)); cd[o + 2] = 255 * (1 - Math.exp(-1.9 * b)); cd[o + 3] = 255;
    gd[o] = Math.min(255, (emA[j] * 0.55 + Math.max(0, r - 0.85) * 0.35) * 255);
    gd[o + 1] = Math.min(255, (emA[j + 1] * 0.55 + Math.max(0, g - 0.85) * 0.35) * 255);
    gd[o + 2] = Math.min(255, (emA[j + 2] * 0.55 + Math.max(0, b - 0.85) * 0.35) * 255);
    gd[o + 3] = 255;
  }
  colorX.putImageData(colorImg, 0, 0);
  glowX.putImageData(glowImg, 0, 0);
  // ---- glyphs: redraw only cells whose character changed
  for (let r = 0, i = 0; r < rows; r++) for (let c = 0; c < cols; c++, i++) {
    const code = chA[i];
    if (code === prevCh[i]) continue;
    prevCh[i] = code;
    glyphX.fillStyle = '#000'; glyphX.fillRect(c * cwD, r * chD, cwD, chD);
    if (code !== 32) glyphX.drawImage(glyph(code), c * cwD, r * chD);
  }

  // ---- compose: white glyphs x per-cell colour, then bloom
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(glyphC, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(colorC, 0, 0, cols * cwD, rows * chD);
  ctx.imageSmoothingEnabled = true;
  g2X.clearRect(0, 0, g2C.width, g2C.height); g2X.drawImage(glowC, 0, 0, g2C.width, g2C.height);
  g3X.clearRect(0, 0, g3C.width, g3C.height); g3X.drawImage(g2C, 0, 0, g3C.width, g3C.height);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.35; ctx.drawImage(glowC, 0, 0, cols * cwD, rows * chD);
  ctx.globalAlpha = 0.9; ctx.drawImage(g2C, 0, 0, cols * cwD, rows * chD);
  ctx.globalAlpha = 0.8; ctx.drawImage(g3C, 0, 0, cols * cwD, rows * chD);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(vigC, 0, 0);

  statT -= dt;
  if (statT <= 0) {
    statT = 0.5;
    const tpm = pays.filter(p => p[0] > simT - 60).length;
    moneyEl.textContent = '$' + Math.floor(money).toLocaleString();
    statsEl.textContent = `${tpm} trips/min · ${cars.length} cars`;
    const todo = places.find(p => !p.connected);
    hintEl.textContent = mode !== 'draw' ? 'drag to pan · pinch or scroll to zoom'
      : todo ? `connect ${todo.name} · drag a road between two signs` : 'drag to draw a road · two fingers to pan & zoom';
  }
  requestAnimationFrame(frame);
}

// ================================================================ input
let mode = 'draw';
const ptrs = new Map();
let pinch = null, panning = false;
function zoomAt(mx, my, f) {
  const [x, y] = s2w(mx, my);
  const nF = clamp(F * f, 4, 18);
  if (Math.abs(nF - F) < 1e-3) return;
  F = nF; resizeCells(); setRain();
  cam.ox = mx - (x - y) * TWp / 2; cam.oy = my - (x + y) * THp / 2;
}
function startStroke(e) { const p = s2w(e.clientX, e.clientY); stroke = { pts: [p], t: [simT] }; }
function extendStroke(e) {
  const raw = s2w(e.clientX, e.clientY), l = stroke.pts[stroke.pts.length - 1];
  const p = [l[0] + (raw[0] - l[0]) * 0.5, l[1] + (raw[1] - l[1]) * 0.5];
  if (Math.hypot(p[0] - l[0], p[1] - l[1]) <= 0.45) return;
  if ((plen(stroke.pts) + Math.hypot(p[0] - l[0], p[1] - l[1])) * COST > money) { stroke.broke = true; return; }
  stroke.pts.push(p); stroke.t.push(simT); stroke.s = null;
}
view.addEventListener('contextmenu', e => e.preventDefault());
view.addEventListener('pointerdown', e => {
  view.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) {
    if (mode === 'draw' && e.button === 0) { startStroke(e); panning = false; } else panning = true;
  } else { stroke = null; baseDirty = true; panning = false; pinch = null; }
});
view.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 1) {
    if (stroke) extendStroke(e);
    else if (panning) { cam.ox += e.clientX - p.x; cam.oy += e.clientY - p.y; baseDirty = true; }
    p.x = e.clientX; p.y = e.clientY;
    return;
  }
  p.x = e.clientX; p.y = e.clientY;
  const [a, b] = [...ptrs.values()];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, d = Math.hypot(a.x - b.x, a.y - b.y);
  if (pinch) { cam.ox += mx - pinch.mx; cam.oy += my - pinch.my; zoomAt(mx, my, d / Math.max(1, pinch.d)); baseDirty = true; }
  pinch = { mx, my, d };
});
const up = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId); pinch = null;
  if (stroke && ptrs.size === 0) { const s = stroke; stroke = null; commitStroke(s.pts); baseDirty = true; }
  if (ptrs.size === 0) panning = false;
};
view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
view.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0012)); baseDirty = true; }, { passive: false });
addEventListener('resize', () => { const [x, y] = s2w(W / 2, H / 2); resizeAll(); centerOn(x, y); setRain(); });

const $ = id => document.getElementById(id);
$('bMode').onclick = () => {
  mode = mode === 'draw' ? 'pan' : 'draw';
  $('bMode').textContent = mode; $('bMode').setAttribute('aria-pressed', String(mode === 'draw'));
  statT = 0;
};
$('bUndo').onclick = () => { if (!roads.length) return; const r = roads.pop(); money += r.cost || 0; rebuildNetwork(); remapCars(); save(); };
$('bClear').onclick = () => { for (const r of roads) money += r.cost || 0; roads = []; cars = []; incidents.length = 0; rebuildNetwork(); save(); };
$('bRain').onclick = () => { wi = (wi + 1) % WEATHER.length; $('vRain').textContent = WEATHER[wi].name; setRain(); };
$('bTraffic').onclick = () => { ti = (ti + 1) % TRAFFIC.length; $('vTraffic').textContent = TRAFFIC[ti].name; };
$('bCrash').onclick = triggerCrash;

// ================================================================ boot: a small starter network so the city is alive on open
resizeAll();
F = clamp(Math.round(W / 65), 5, 8);
resizeCells();
centerOn(0, 0);
setRain();
if (!load()) {
  const S = (u, v) => s2w(u * W, v * H);
  addPlace('MOTEL', ...S(0.24, 0.3), 0, false);
  addPlace('DINER', ...S(0.76, 0.45), 1, true);
  addPlace('GAS 24', ...S(0.32, 0.72), 2, false);
  const line = [];
  for (let k = 0; k <= 30; k++) { const t = k / 30; line.push(S(0.24 + 0.52 * t, 0.3 + 0.15 * t - 0.1 * Math.sin(t * Math.PI))); }
  commitStroke(line, true);
  for (let k = 0; k < 450; k++) { simT += 1 / 30; updateDemand(1 / 30); updateCars(1 / 30); }
  money = 150; tripsTotal = 0; pays.length = 0; floaters.length = 0;
  setTimeout(() => toast('connect GAS 24 · drag a road from a sign to another sign'), 900);
} else {
  let cx = 0, cy = 0; for (const p of places) { cx += p.x; cy += p.y; }
  centerOn(cx / places.length, cy / places.length);
  const m0 = money, t0 = tripsTotal;
  for (let k = 0; k < 300; k++) { simT += 1 / 30; updateDemand(1 / 30); updateCars(1 / 30); }
  money = m0; tripsTotal = t0; pays.length = 0; floaters.length = 0;
}
baseDirty = true;
if (document.fonts && document.fonts.load) document.fonts.load(`500 12px "JetBrains Mono"`).then(() => { atlas.clear(); prevCh.fill(-1); }).catch(() => {});
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
