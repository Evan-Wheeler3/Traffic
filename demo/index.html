<title>Rainline</title>

<style>

.brand span { color: var(--dim); }
.stats { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 4px; }

  for (const c of cars) {
    while (bi < blds.length && bKey(blds[bi]) < c.x + c.y) drawBuilding(blds[bi++]);
    const [sx, sy] = w2s(c.x, c.y);
    if (sx < -90 || sx > W + 90 || sy < -60 || sy > H + 120) continue;
    drawCar(c);
  }
  while (bi < blds.length) drawBuilding(blds[bi++]);
  // road flares at incidents
  for (const inc of incidents) for (const f of inc.flares) {
    const fl = 0.7 + 0.3 * Math.sin(simT * 23 + f.ph) * Math.sin(simT * 7 + f.ph), [c, r] = cellOf(f.x, f.y);
    put(c, r, CH.star, [0.9, 0.4, 0.3], LC.flare, 1.6 * fl);
    poolInto(litA, f.x, f.y, 3.4, LC.flare, 0.8 * fl);
    refl.push([c, r, LC.flare, 0.7 * fl]);
  }
  // paving sparkle behind the finger
  if (stroke) {
    const n = stroke.pts.length;
    for (let k = Math.max(0, n - 14); k < n; k++) {
      const age = simT - stroke.t[k]; if (age > 0.7) continue;
      const p = stroke.pts[k], a = 1 - age / 0.7;
      for (let j = 0; j < 16; j++) {
        const ang = rnd() * TAU, rad = rnd() * HW, [c, r] = cellOf(p[0] + Math.cos(ang) * rad, p[1] + Math.sin(ang) * rad);
        put(c, r, pick([CH.star, CH.plus, CH.x, CH.dot]), [0.6, 0.9, 1], bridgeMode ? [1, 0.6, 0.2] : [0.45, 0.85, 1], 1.4 * a);
      }
      poolInto(litA, p[0], p[1], 4, [0.4, 0.8, 1], 0.5 * a);
    }
    const tip = stroke.pts[n - 1], [c, r] = cellOf(tip[0], tip[1]);
    put(c, r, CH.plus, [1, 1, 1], stroke.broke ? LC.red : [0.7, 0.95, 1], 2.2);
  }
  for (const [c, r, col, I] of refl) if (I > 0.02) reflectInto(litA, c, r, col, I, false);
  // rain (lit by whatever light the cell already has)
  for (const s of splashes) if (s.r < rows && s.c < cols && isRoad[s.r * cols + s.c]) put(s.c, s.r, s.t < 0.1 ? CH.dot : s.t < 0.2 ? CH.o : CH.deg, AL.splash);
  for (const b of bolts) { const on = b.t < 0.08 || (b.t > 0.16 && b.t < 0.3); if (on) for (const [c, r, chr] of b.segs) put(c, r, chr, [1, 1, 1], [0.85, 0.9, 1], 4); }
  drawGameLayer(dt);

  // ---- resolve colour per cell
  const cd = colorImg.data, gd = glowImg.data;
  for (let i = 0; i < NC; i++) {
    const j = i * 3, o = i * 4;
    const r = albA[j] * litA[j] + emA[j], g = albA[j + 1] * litA[j + 1] + emA[j + 1], b = albA[j + 2] * litA[j + 2] + emA[j + 2];
    cd[o] = 255 * (1 - Math.exp(-2.3 * r)); cd[o + 1] = 255 * (1 - Math.exp(-2.3 * g)); cd[o + 2] = 255 * (1 - Math.exp(-2.3 * b)); cd[o + 3] = 255;
    gd[o] = Math.min(255, (emA[j] * 0.55 + Math.max(0, r - 0.85) * 0.35) * 255);
    gd[o + 1] = Math.min(255, (emA[j + 1] * 0.55 + Math.max(0, g - 0.85) * 0.35) * 255);
    gd[o + 2] = Math.min(255, (emA[j + 2] * 0.55 + Math.max(0, b - 0.85) * 0.35) * 255);
    gd[o + 3] = 255;
  }
  colorX.putImageData(colorImg, 0, 0);
  glowX.putImageData(glowImg, 0, 0);
  // ---- glyphs: redraw only cells whose character changed
  for (let r = 0, i = 0; r < rows; r++) for (let c = 0; c < cols; c++, i++) {
    const code = chA[i];
    if (code === prevCh[i]) continue;
    prevCh[i] = code;
    glyphX.fillStyle = '#000'; glyphX.fillRect(c * cwD, r * chD, cwD, chD);
    if (code !== 32) glyphX.drawImage(glyph(code), c * cwD, r * chD);
  }

  // ---- compose: white glyphs x per-cell colour, then bloom
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(glyphC, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(colorC, 0, 0, cols * cwD, rows * chD);
  ctx.imageSmoothingEnabled = true;
  drawRainSprites();
  g2X.clearRect(0, 0, g2C.width, g2C.height); g2X.drawImage(glowC, 0, 0, g2C.width, g2C.height);
  g3X.clearRect(0, 0, g3C.width, g3C.height); g3X.drawImage(g2C, 0, 0, g3C.width, g3C.height);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 1; ctx.drawImage(g2C, 0, 0, cols * cwD, rows * chD);
  ctx.globalAlpha = 0.45; ctx.drawImage(g3C, 0, 0, cols * cwD, rows * chD);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const fo = flash > 0.02 ? (flash * 0.22).toFixed(3) : '0';
  if (fo !== flashEl.style.opacity) flashEl.style.opacity = fo;

  statT -= dt;
  if (statT <= 0) {
    statT = 0.5;
    const tpm = pays.filter(p => p[0] > simT - 60).length;
    moneyEl.textContent = '$' + Math.floor(money).toLocaleString();
    statsEl.textContent = `${tpm} trips/min · ${cars.length} cars`;
    const todo = places.find(p => !p.connected);
    hintEl.textContent = mapView ? 'tap anywhere to jump there · drag to look around'
      : bridgeMode ? 'bridge · draw across a road to fly over it (2.5x cost)'
      : freeDraw ? 'drag anywhere to build · two fingers to move'
      : todo ? `connect ${todo.name} · drag from a sign to another sign` : 'drag from a sign or road to build · drag empty ground to move';
  }
  requestAnimationFrame(frame);
}

// ================================================================ input
let freeDraw = false, mapView = false, normalTW = 40, mapBack = null;
const ptrs = new Map();
let pinch = null, panning = false, inertia = null, lastPan = null, edgePtr = null;
function setZoom(tw) { zoomTW = tw; F = fontFor(tw); resizeCells(); setRain(); baseDirty = true; }
function fitMap() {
  const pts = [];
  for (const p of places) pts.push([p.x, p.y]);
  for (const r of roads) for (let i = 0; i < r.pts.length; i += 4) pts.push(r.pts[i]);
  if (!pts.length) return;
  let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
  for (const [x, y] of pts) { u0 = Math.min(u0, x - y); u1 = Math.max(u1, x - y); v0 = Math.min(v0, x + y); v1 = Math.max(v1, x + y); }
  const du = Math.max(4, u1 - u0 + 12), dv = Math.max(4, v1 - v0 + 16);
  setZoom(clamp(Math.min(2 * (W - 32) / du, 4 * (H - 230) / dv), 6, normalTW));
  const cx = (u0 + u1) / 2, cy = (v0 + v1) / 2, x = (cx + cy) / 2, y = (cy - cx) / 2;
  setCam(W / 2 - (x - y) * TWp / 2, H * 0.47 - (x + y) * THp / 2);
  follow = null; cardEl.hidden = true;
}
function enterMap() { mapBack = s2w(W / 2, H * 0.45); fitMap(); mapView = true; inertia = null; mapUI(); }
function exitMap(at) { setZoom(normalTW); const p = at || mapBack; if (p) centerOn(p[0], p[1]); mapView = false; inertia = null; mapUI(); }
function mapUI() { const b = document.getElementById('bMap'); b.textContent = mapView ? 'back' : 'map'; b.setAttribute('aria-pressed', String(mapView)); statT = 0; }
// a drag draws when it starts on a sign, a road or a road end; anywhere else it scrolls the map
function startsDrawing(x, y) {
  if (mapView) return false;
  if (freeDraw) return true;
  const [wx_, wy_] = s2w(x, y);
  if (places.some(p => Math.hypot(p.x - wx_, p.y - wy_) < PLACE_R + 1.5)) return true;
  return q(wx_, wy_) < 1.6;
}
// while drawing, holding near a screen edge scrolls the map so roads can run past the screen
function edgeScroll(dt) {
  if (!stroke || !edgePtr) return;
  const m = 46, sp = 340 * dt;
  let dx = 0, dy = 0;
  if (edgePtr.x < m) dx = sp * (1 - edgePtr.x / m); else if (edgePtr.x > W - m) dx = -sp * (1 - (W - edgePtr.x) / m);
  if (edgePtr.y < m + 50) dy = sp * (1 - (edgePtr.y - 50) / m); else if (edgePtr.y > H - m - 130) dy = -sp * (1 - (H - 130 - edgePtr.y) / m);
  if (dx || dy) { panBy(clamp(dx, -sp, sp), clamp(dy, -sp, sp)); extendStroke({ clientX: edgePtr.x, clientY: edgePtr.y }); }
}
function updateInertia(dt) {
  if (!inertia || ptrs.size) return;
  panBy(inertia.vx * dt, inertia.vy * dt);
  const k = Math.exp(-4.5 * dt); inertia.vx *= k; inertia.vy *= k;
  if (Math.hypot(inertia.vx, inertia.vy) < 15) inertia = null;
}
let downAt = null;
function startStroke(e) { const p = s2w(e.clientX, e.clientY); stroke = { pts: [p], t: [simT] }; }
function extendStroke(e) {
  const raw = s2w(e.clientX, e.clientY), l = stroke.pts[stroke.pts.length - 1];
  const p = [l[0] + (raw[0] - l[0]) * 0.5, l[1] + (raw[1] - l[1]) * 0.5];
  if (Math.hypot(p[0] - l[0], p[1] - l[1]) <= 0.45) return;
  if ((plen(stroke.pts) + Math.hypot(p[0] - l[0], p[1] - l[1])) * costPer() > money) { stroke.broke = true; return; }
  stroke.pts.push(p); stroke.t.push(simT); stroke.s = null;
}
view.addEventListener('contextmenu', e => e.preventDefault());
view.addEventListener('pointerdown', e => {
  view.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  downAt = ptrs.size === 1 ? { x: e.clientX, y: e.clientY, t: performance.now(), moved: false } : null;
  inertia = null;
  if (ptrs.size === 1) {
    if (e.button === 0 && startsDrawing(e.clientX, e.clientY)) { startStroke(e); panning = false; edgePtr = { x: e.clientX, y: e.clientY }; }
    else { panning = true; lastPan = { t: performance.now(), vx: 0, vy: 0 }; }
  } else { if (stroke) { stroke = null; baseDirty = true; } panning = false; pinch = null; }
});
view.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 9) downAt.moved = true;
  if (ptrs.size > 1 || (panning && downAt && downAt.moved)) { follow = null; cardEl.hidden = true; }
  if (ptrs.size === 1) {
    if (stroke) { extendStroke(e); edgePtr = { x: e.clientX, y: e.clientY }; }
    else if (panning) {
      const dx = e.clientX - p.x, dy = e.clientY - p.y, now = performance.now(), dtp = Math.max(1, now - lastPan.t) / 1000;
      panBy(dx, dy);
      lastPan.vx = lastPan.vx * 0.6 + (dx / dtp) * 0.4; lastPan.vy = lastPan.vy * 0.6 + (dy / dtp) * 0.4; lastPan.t = now;
    }
    p.x = e.clientX; p.y = e.clientY;
    return;
  }
  p.x = e.clientX; p.y = e.clientY;
  const [a, b] = [...ptrs.values()];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, d = Math.hypot(a.x - b.x, a.y - b.y);
  if (pinch) panBy(mx - pinch.mx, my - pinch.my);
  pinch = { mx, my, d };
});
const up = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId); pinch = null;
  const tap = downAt && !downAt.moved && performance.now() - downAt.t < 400 && ptrs.size === 0;
  if (tap) {
    const had = !!stroke; stroke = null; if (had) baseDirty = true;
    if (mapView) exitMap(s2w(e.clientX, e.clientY)); else handleTap(e.clientX, e.clientY);
  } else if (panning && ptrs.size === 0 && lastPan && performance.now() - lastPan.t < 80 && Math.hypot(lastPan.vx, lastPan.vy) > 120) {
    inertia = { vx: clamp(lastPan.vx, -2500, 2500), vy: clamp(lastPan.vy, -2500, 2500) };
  }
  if (ptrs.size === 0) edgePtr = null;
  if (stroke && ptrs.size === 0) { const s = stroke; stroke = null; commitStroke(s.pts); baseDirty = true; }
  if (ptrs.size === 0) panning = false;
};
view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
view.addEventListener('wheel', e => { e.preventDefault(); if (!e.ctrlKey) panBy(-e.deltaX, -e.deltaY); }, { passive: false });
addEventListener('resize', () => { const [x, y] = s2w(W / 2, H / 2); resizeAll(); centerOn(x, y); setRain(); });

const $ = id => document.getElementById(id);
$('bBridge').onclick = () => {
  bridgeMode = !bridgeMode;
  $('bBridge').setAttribute('aria-pressed', String(bridgeMode));
  statT = 0;
};
$('bSound').onclick = () => {
  if (!AC && !initSound()) { $('vSound').textContent = 'n/a'; return; }
  soundOn = !soundOn;
  $('vSound').textContent = soundOn ? 'on' : 'off';
  if (soundOn) { AC.resume(); SND.master.gain.setTargetAtTime(0.9, AC.currentTime, 0.2); }
  else SND.master.gain.setTargetAtTime(0, AC.currentTime, 0.2);
};
$('bMode').onclick = () => {
  freeDraw = !freeDraw;
  $('bMode').setAttribute('aria-pressed', String(freeDraw));
  statT = 0;
};
$('bUndo').onclick = () => { if (!roads.length) return; const r = roads.pop(); money += r.cost || 0; rebuildNetwork(); remapCars(); save(); };
$('bClear').onclick = () => { for (const r of roads) money += r.cost || 0; roads = []; cars = []; incidents.length = 0; rebuildNetwork(); save(); };
$('bRain').onclick = () => { wi = (wi + 1) % WEATHER.length; $('vRain').textContent = WEATHER[wi].name; setRain(); };
$('bTraffic').onclick = () => { ti = (ti + 1) % TRAFFIC.length; $('vTraffic').textContent = TRAFFIC[ti].name; };
$('bCrash').onclick = () => triggerCrash(false);
$('bMap').onclick = () => (mapView ? exitMap() : enterMap());

// ================================================================ boot: a small starter network so the city is alive on open
resizeAll();
F = clamp(Math.round(W / 65), 5, 8);
zoomTW = normalTW = F * 0.6 * TILE_COLS;
resizeCells();
centerOn(0, 0);
setRain();
if (!load()) {
  const S = (u, v) => s2w(u * W, v * H);
  addPlace('MOTEL', ...S(0.24, 0.3), 0, false);
  addPlace('DINER', ...S(0.76, 0.45), 1, true);
  addPlace('GAS 24', ...S(0.32, 0.72), 2, false);
  const line = [];
  for (let k = 0; k <= 30; k++) { const t = k / 30; line.push(S(0.24 + 0.52 * t, 0.3 + 0.15 * t - 0.1 * Math.sin(t * Math.PI))); }
  commitStroke(line, true);
  for (let k = 0; k < 450; k++) { simT += 1 / 30; updateDemand(1 / 30); updateCars(1 / 30); }
  money = 150; tripsTotal = 0; pays.length = 0; floaters.length = 0;
  setTimeout(() => toast('connect GAS 24 · drag a road from a sign to another sign'), 900);
} else {
  let cx = 0, cy = 0; for (const p of places) { cx += p.x; cy += p.y; }
  centerOn(cx / places.length, cy / places.length);
  const m0 = money, t0 = tripsTotal;
  for (let k = 0; k < 300; k++) { simT += 1 / 30; updateDemand(1 / 30); updateCars(1 / 30); }
  money = m0; tripsTotal = t0; pays.length = 0; floaters.length = 0;
}
baseDirty = true;
if (document.fonts && document.fonts.load) document.fonts.load(`500 12px "JetBrains Mono"`).then(() => { atlas.clear(); prevCh.fill(-1); }).catch(() => {});
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
