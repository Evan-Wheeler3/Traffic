<title>Rainline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one full-bleed canvas city, a thin HUD strip on top, a wrap-around control bar on the bottom. */
:root {
  --bg: #04050a;
  --ink: #c9d3e6;
  --dim: #66708c;
  --line: #262e48;
  --neon: #ff4fb0;
  --cyan: #58e6ff;
  --panel: rgba(6, 8, 16, 0.74);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
body { margin: 0; color: var(--ink); font-family: var(--mono); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
.hud-top {
  position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
}
.brand b { color: var(--neon); font-weight: 700; text-shadow: 0 0 10px rgba(255, 79, 176, 0.75), 0 0 2px rgba(255, 79, 176, 0.9); }
.brand span { color: var(--dim); }
.stats { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
.hud-bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
.bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; pointer-events: auto; }
button {
  font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  padding: 12px 12px; border-radius: 2px; cursor: pointer;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
button .v { color: var(--cyan); }
button:active { border-color: var(--cyan); color: #fff; }
button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
.hint { font-size: 10px; color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; }
</style>

<canvas id="view" aria-label="Isometric ASCII city at night: traffic moving through rain on a roundabout, streets and an elevated freeway"></canvas>
<div class="hud-top">
  <div class="brand"><b>RAINLINE</b> <span>// look test</span></div>
  <div class="stats" id="stats">booting</div>
</div>
<div class="hud-bottom">
  <div class="bar">
    <button id="bRain" type="button">rain <span class="v" id="vRain">heavy</span></button>
    <button id="bTraffic" type="button">traffic <span class="v" id="vTraffic">normal</span></button>
    <button id="bBrake" type="button">brake wave</button>
    <button id="bCrash" type="button">crash</button>
    <button id="bView" type="button">recenter</button>
  </div>
  <div class="hint">drag to pan · pinch or scroll to zoom</div>
</div>

<script>
(() => {
'use strict';

// ============================================================ constants
const TW = 16, TH = 8, ZH = 8;          // iso tile width/height, px per height level (at zoom 1)
const N = 64;                           // map is N x N tiles
const DY0 = 44, DY1 = 51, DZ = 3;       // elevated freeway deck: y range and height
const C = { x: 32, y: 32 }, R = 7;      // roundabout centre and lane radius
const FONT = '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace';
const TAU = Math.PI * 2;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

let seed = 20261106;
const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const pick = a => a[(rnd() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function hash(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const s = t => t * t * (3 - 2 * t);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  const u = s(xf), v = s(yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function mul(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (((n >> 16) & 255) * k) | 0), g = Math.min(255, (((n >> 8) & 255) * k) | 0), b = Math.min(255, ((n & 255) * k) | 0);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

// ============================================================ canvases
const view = document.getElementById('view');
const ctx = view.getContext('2d');
const mk = (w = 1, h = 1) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const groundC = mk(), deckC = mk(), tmpC = mk(), vigC = mk();
const lightC = mk(), dlightC = mk(), sLightC = mk(), sDLightC = mk(), rainC = mk();
const gx = groundC.getContext('2d'), dkx = deckC.getContext('2d'), tx = tmpC.getContext('2d'), vx = vigC.getContext('2d');
const lx = lightC.getContext('2d'), dlx = dlightC.getContext('2d'), slx = sLightC.getContext('2d'), sdlx = sDLightC.getContext('2d'), rx = rainC.getContext('2d');
let W = 1, H = 1, DPR = 1, VW = 1, VH = 1, LW = 1, LH = 1, LK = 0.5;
const LS = 0.5;  // light buffers run at half resolution: cheaper and naturally soft

const cam = { zoom: 1.25, ox: 0, oy: 0 };
let camDirty = true, lastZoomChange = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cx = W / 2, cy = H / 2;
  const wc = screenToWorld(cx, cy);
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  VW = Math.round(W * DPR); VH = Math.round(H * DPR);
  view.width = VW; view.height = VH;
  for (const c of [groundC, deckC, tmpC, vigC]) { c.width = VW; c.height = VH; }
  LW = Math.ceil(VW * LS); LH = Math.ceil(VH * LS); LK = LW / W;
  for (const c of [lightC, dlightC, sLightC, sDLightC, rainC]) { c.width = LW; c.height = LH; }
  buildVignette();
  if (booted) centerOn(wc[0], wc[1]);
  camDirty = true;
  setRainCount();
}

// ============================================================ projection
const isoX = (x, y) => (x - y) * TW / 2;
const isoY = (x, y, z) => (x + y) * TH / 2 - z * ZH;
function toScreen(x, y, z) { return [isoX(x, y) * cam.zoom + cam.ox, isoY(x, y, z) * cam.zoom + cam.oy]; }
function screenToWorld(sx, sy) {
  const a = (sx - cam.ox) / cam.zoom / (TW / 2), b = (sy - cam.oy) / cam.zoom / (TH / 2);
  return [(a + b) / 2, (b - a) / 2];
}
function centerOn(x, y) { cam.ox = W / 2 - isoX(x, y) * cam.zoom; cam.oy = H / 2 - isoY(x, y, 0) * cam.zoom; }
function clampCam() {
  const [x, y] = screenToWorld(W / 2, H / 2);
  const cx = clamp(x, 4, N - 4), cy = clamp(y, 4, N - 4);
  if (cx !== x || cy !== y) centerOn(cx, cy);
}
// put a context into "tile space" (x, y in tiles, at height z); k = css px -> buffer px
function setIso(c, k, z) {
  const s = cam.zoom * k;
  c.setTransform(TW / 2 * s, TH / 2 * s, -TW / 2 * s, TH / 2 * s, cam.ox * k, (cam.oy - z * ZH * cam.zoom) * k);
}
const fontPx = () => Math.max(4, Math.round(ZH * cam.zoom * 1.2 * DPR));

// ============================================================ glyph atlas + light sprites
const atlas = new Map();
function glyph(ch, col, fs) {
  const key = fs + '|' + ch + '|' + col;
  let g = atlas.get(key);
  if (g) return g;
  if (atlas.size > 6000) atlas.clear();
  const w = Math.ceil(fs * 0.8) + 2, h = Math.ceil(fs * 1.3) + 2;
  g = mk(w, h);
  const c = g.getContext('2d');
  c.font = `500 ${fs}px ${FONT}`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = col;
  c.fillText(ch, w / 2, h / 2 + fs * 0.04);
  atlas.set(key, g);
  return g;
}
// draw glyph at world point onto main ctx (device px)
function dg(ch, col, x, y, z, fs) {
  const g = glyph(ch, col, fs);
  const sx = (isoX(x, y) * cam.zoom + cam.ox) * DPR, sy = (isoY(x, y, z) * cam.zoom + cam.oy) * DPR;
  ctx.drawImage(g, sx - g.width / 2, sy - g.height / 2);
}

let sprId = 0;
function makeSprite(w, h, f) {
  const c = mk(w, h), g = c.getContext('2d'), im = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const a = clamp(f(x / (w - 1), y / (h - 1)), 0, 1), i = (y * w + x) * 4;
    im.data[i] = im.data[i + 1] = im.data[i + 2] = 255; im.data[i + 3] = a * 255;
  }
  g.putImageData(im, 0, 0);
  c.sid = ++sprId;
  return c;
}
const SP_RAD = makeSprite(64, 64, (u, v) => { const dx = u * 2 - 1, dy = v * 2 - 1, d = Math.sqrt(dx * dx + dy * dy); return d >= 1 ? 0 : Math.pow(1 - d, 2.2); });
const SP_CONE = makeSprite(128, 64, (u, v) => {
  const y = v * 2 - 1; if (u <= 0.001) return 0;
  const ang = Math.abs(y) / (u + 0.1);
  const edge = clamp(1 - ang, 0, 1);
  return Math.pow(edge, 1.4) * Math.pow(1 - u, 1.25) * Math.min(1, u * 5);
});
const SP_STREAK = makeSprite(16, 64, (u, v) => { const dx = u * 2 - 1; return Math.exp(-dx * dx * 5) * Math.pow(1 - v, 1.5) * (0.75 + 0.25 * Math.sin(v * 31)); });
const SP_FLARE = makeSprite(128, 8, (u, v) => { const dx = u * 2 - 1, dy = v * 2 - 1; return Math.exp(-dy * dy * 6) * Math.pow(1 - Math.abs(dx), 2.6); });
const tints = new Map();
function tint(spr, col) {
  const k = spr.sid + col;
  let c = tints.get(k);
  if (!c) {
    c = mk(spr.width, spr.height);
    const g = c.getContext('2d');
    g.drawImage(spr, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
    tints.set(k, c);
  }
  return c;
}
// colours of light
const COL = {
  head: '#fff1d8', headCone: '#ffe9c4', flare: '#9cc8ff', tail: '#ff2414', brake: '#ff3a22',
  sodium: '#ff9136', led: '#cfe0ff', red: '#ff2a3a', amber: '#ffb028', green: '#3dffa0',
  copR: '#ff1f3d', copB: '#2f62ff', hazard: '#ffa21f'
};

// pools / cones in tile space onto a light buffer
function lPool(L, x, y, z, r, col, a) {
  setIso(L, LK, z); L.globalAlpha = a;
  L.drawImage(tint(SP_RAD, col), x - r, y - r, r * 2, r * 2);
}
function lCone(L, x, y, z, hx, hy, len, wid, col, a) {
  setIso(L, LK, z); L.translate(x, y); L.rotate(Math.atan2(hy, hx)); L.globalAlpha = a;
  L.drawImage(tint(SP_CONE, col), -0.2, -wid / 2, len, wid);
}
function lStreak(L, x, y, z, len, wid, col, a) {
  const [sx, sy] = toScreen(x, y, z);
  L.setTransform(LK, 0, 0, LK, 0, 0); L.globalAlpha = a;
  L.drawImage(tint(SP_STREAK, col), sx - wid / 2, sy, wid, len);
}
// glows on main ctx (screen space)
function glowAt(x, y, z, r, col, a) {
  if (a <= 0.004) return;
  const [sx, sy] = toScreen(x, y, z);
  if (sx < -r || sy < -r || sx > W + r || sy > H + r) return;
  ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(tint(SP_RAD, col), (sx - r) * DPR, (sy - r) * DPR, r * 2 * DPR, r * 2 * DPR);
}
function streakAt(x, y, z, len, wid, col, a) {
  const [sx, sy] = toScreen(x, y, z);
  if (sx < -wid || sx > W + wid || sy > H || sy + len < 0) return;
  ctx.globalAlpha = a;
  ctx.drawImage(tint(SP_STREAK, col), (sx - wid / 2) * DPR, sy * DPR, wid * DPR, len * DPR);
}
function flareAt(x, y, z, w, h, col, a) {
  const [sx, sy] = toScreen(x, y, z);
  ctx.globalAlpha = a;
  ctx.drawImage(tint(SP_FLARE, col), (sx - w / 2) * DPR, (sy - h / 2) * DPR, w * DPR, h * DPR);
}

// ============================================================ world: roads
const roads = [];
function addLine(ax, ay, bx, by, hw) {
  const len = Math.hypot(bx - ax, by - ay);
  roads.push({ k: 'l', ax, ay, bx, by, hw, len, ux: (bx - ax) / len, uy: (by - ay) / len });
}
addLine(C.x + R - 1, C.y, 68, C.y, 1.6);   // east arm
addLine(-4, C.y, C.x - R + 1, C.y, 1.6);   // west arm
addLine(C.x, -4, C.x, C.y - R + 1, 1.6);   // north arm
addLine(C.x, C.y + R - 1, C.x, 68, 1.6);   // south arm (passes under freeway)
addLine(-4, 12, 68, 12, 2.1);              // H street
addLine(12, -4, 12, 68, 2.1);              // V street
roads.push({ k: 'r', hw: 1.7 });
function roadQ(r, px, py) {
  if (r.k === 'l') {
    const vx_ = px - r.ax, vy_ = py - r.ay;
    const u = vx_ * r.ux + vy_ * r.uy, uc = clamp(u, 0, r.len);
    const lat = -vx_ * r.uy + vy_ * r.ux;
    return { d: Math.hypot(px - (r.ax + r.ux * uc), py - (r.ay + r.uy * uc)), lat, u };
  }
  return { d: Math.abs(Math.hypot(px - C.x, py - C.y) - R), lat: 0, u: 0 };
}
const SIGS = [{ x: 12, y: 12, off: 0 }, { x: 32, y: 12, off: 6.2 }, { x: 12, y: 32, off: 11.5 }];

// ============================================================ world: tiles
const ROAD = 1, SIDE = 2, LOT = 4, ISLAND = 5, CORR = 6;
const tt = new Uint8Array(N * N), tch = new Array(N * N).fill(''), tcol = new Array(N * N).fill('');
const underDeck = py => py >= DY0 && py < DY1;
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  const px = x + 0.5, py = y + 0.5, i = y * N + x, h = hash(x, y);
  let b1 = null, q1 = null, e1 = 1e9, e2 = 1e9;
  for (const r of roads) {
    const q = roadQ(r, px, py), e = q.d - r.hw;
    if (e < e1) { e2 = e1; e1 = e; b1 = r; q1 = q; } else if (e < e2) e2 = e;
  }
  const dc = Math.hypot(px - C.x, py - C.y);
  let ch = '', col = '';
  if (e1 < 0) {
    tt[i] = ROAD;
    ch = h < 0.5 ? '.' : h < 0.72 ? '·' : h < 0.88 ? ',' : '\''; col = '#7c8498';
    if (vnoise(px * 0.3, py * 0.3) > 0.66) { ch = h < 0.55 ? '~' : '≈'; col = '#93b4e8'; }
    if (b1.k === 'l' && Math.abs(q1.lat) < 0.36 && e2 > 0.4 && Math.floor(q1.u) % 2 === 0) { ch = '▪'; col = '#efbd4a'; }
    for (const s of SIGS) {
      const ax = Math.abs(px - s.x), ay = Math.abs(py - s.y);
      if ((ax > 2.3 && ax < 3.3 && ay < 2.2) || (ay > 2.3 && ay < 3.3 && ax < 2.2)) { ch = '▬'; col = '#cfd4de'; }
    }
  } else if (e1 < 1.1) {
    tt[i] = SIDE; ch = h < 0.55 ? ':' : h < 0.85 ? '.' : '+'; col = '#5d6478';
  } else if (dc < R) {
    tt[i] = ISLAND;
    if (dc < 1.3) { ch = h < 0.5 ? 'o' : 'O'; col = '#8fe6ff'; }
    else if (h > 0.9) { ch = '*'; col = '#ff79b8'; }
    else { ch = h < 0.3 ? '"' : h < 0.6 ? ',' : h < 0.8 ? '\'' : '♣'; col = h >= 0.8 ? '#3f9a5f' : '#3e7a52'; }
  } else if (py >= DY0 - 1 && py < DY1 + 1) {
    tt[i] = CORR; ch = h < 0.5 ? '.' : h < 0.8 ? ',' : '░'; col = '#555b69';
    if (vnoise(px * 0.4, py * 0.4) > 0.7) { ch = '~'; col = '#7f9fd0'; }
  } else tt[i] = LOT;
  if (ch && underDeck(py)) col = mul(col, 0.55);
  tch[i] = ch; tcol[i] = col;
}

// ============================================================ world: buildings
const NEON = ['#ff4fb0', '#58e6ff', '#ff6a3d', '#b46bff', '#7dff9a', '#ffd23f'];
const WORDS = ['BAR', 'HOTEL', '24H', 'RAMEN', 'OPEN', 'MOTEL', 'JAZZ', 'PHO', 'CAFE', 'CLUB', 'DINER', 'NOODLE', 'KARAOKE', 'LIQUOR', 'SUSHI', 'TAXI', 'ARCADE'];
const occ = new Uint8Array(N * N);
const buildings = [];
const free = (x, y) => x >= 0 && y >= 0 && x < N && y < N && tt[y * N + x] === LOT && !occ[y * N + x];
function fits(x, y, w, d) { for (let j = y; j < y + d; j++) for (let i = x; i < x + w; i++) if (!free(i, j)) return false; return true; }
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  if (!free(x, y) || rnd() < 0.08) continue;
  let w = 2 + ((rnd() * 3) | 0), d = 2 + ((rnd() * 3) | 0);
  while ((w > 1 || d > 1) && !fits(x, y, w, d)) { if (w >= d) w--; else d--; }
  if (!fits(x, y, w, d) || (w * d < 2 && rnd() < 0.5)) continue;
  for (let j = y; j < y + d; j++) for (let i = x; i < x + w; i++) occ[j * N + i] = 1;
  for (let i = x; i <= x + w; i++) if (free(i, y + d)) occ[(y + d) * N + i] = 2;
  for (let j = y; j < y + d; j++) if (free(x + w, j)) occ[j * N + x + w] = 2;
  const depth = (x + y + w + d) / (2 * N);
  const hmax = Math.round(10 - 6 * depth);
  let h = 1 + ((rnd() * Math.max(1, hmax)) | 0);
  if (rnd() < 0.18) h = 1;
  if (rnd() < 0.06) h += 5;
  buildings.push(makeBuilding(x, y, w, d, h, buildings.length + 1));
}
function makeBuilding(x, y, w, d, h, id) {
  const b = {
    kind: 'b', id, x0: x, y0: y, x1: x + w, y1: y + d, h, layer: 0,
    style: pick(['office', 'apt', 'apt', 'stripe', 'dark']),
    wall: pick(['#161c2c', '#1a172b', '#131d26', '#1b1b24']),
    cache: null, cz: -1, offX: 0, offY: 0, glows: [], pools: []
  };
  b.shop = rnd() < 0.45 ? pick(['#ffb35c', '#7fe7ff', '#ff7ab8', '#fff0c0']) : null;
  if (h >= 3 && rnd() < 0.38) {
    const vert = rnd() < 0.45;
    const cands = WORDS.filter(s => vert ? s.length <= h - 1 : s.length <= w);
    if (cands.length) {
      const word = pick(cands), col = pick(NEON);
      b.sign = { word, col, vert, flick: rnd() < 0.3 };
      for (let k = 0; k < word.length; k++) {
        const p = vert ? [b.x1 + 0.25, b.y1 - 0.5, h - 0.5 - k] : [b.x0 + Math.floor((w - word.length) / 2) + k + 0.5, b.y1 + 0.02, h - 0.5];
        b.glows.push({ x: p[0], y: p[1], z: p[2], ch: word[k] });
      }
      b.pools.push(vert ? { x: b.x1 + 1.6, y: b.y1 - 0.5, r: 3.2, col, a: 0.32 } : { x: b.x0 + w / 2, y: b.y1 + 1.6, r: 3.2, col, a: 0.32 });
    }
  }
  if (b.shop && b.y1 < N) for (let i = b.x0; i < b.x1; i += 2) b.pools.push({ x: i + 0.5, y: b.y1 + 0.9, r: 1.7, col: b.shop, a: 0.3 });
  b.beacon = h >= 8 && rnd() < 0.75 ? rnd() * TAU : null;
  return b;
}
// fill remaining lots: alleys and little parks
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  const i = y * N + x; if (tt[i] !== LOT || occ[i] === 1) continue;
  const h = hash(x + 99, y + 7);
  if (occ[i] === 2) { tch[i] = h < 0.6 ? ',' : '.'; tcol[i] = '#3b404d'; }
  else { tch[i] = h < 0.17 ? '♣' : h < 0.45 ? '"' : h < 0.7 ? ',' : '\''; tcol[i] = h < 0.17 ? '#2f8050' : '#335a41'; }
}

// ============================================================ world: lamps, pillars, signals
const statics = [...buildings];
const lamps = [];

  if (performance.now() - lastZoomChange > 160) {
    let budget = 30;
    for (const b of buildings) if (b.cz !== cam.zoom && budget-- > 0) renderBuilding(b);
  }

  for (const c of cars) carEmit(c);

  // --- light buffers
  const amb = `rgb(${40 + flash * 150 | 0},${47 + flash * 160 | 0},${74 + flash * 180 | 0})`;
  for (const [L, sC] of [[lx, sLightC], [dlx, sDLightC]]) {
    L.setTransform(1, 0, 0, 1, 0, 0); L.globalAlpha = 1; L.globalCompositeOperation = 'source-over';
    L.fillStyle = amb; L.fillRect(0, 0, LW, LH);
    L.globalCompositeOperation = 'lighter';
    L.drawImage(sC, 0, 0);
  }
  for (const c of cars) { carLights(c.layer ? dlx : lx, c); if (c.layer) carLights(lx, c); }
  for (const o of sigPoles) {
    const st = sigState(o.sig, o.axis);
    const sx = o.sig.x + (o.x - o.sig.x) * 0.55, sy = o.sig.y + (o.y - o.sig.y) * 0.55;
    lPool(lx, sx, sy, 0, 1.8, sigCol(st), 0.35);
  }
  for (const inc of incidents) for (const f of inc.flares) {
    const fl = 0.7 + 0.3 * Math.sin(simT * 23 + f.ph) * Math.sin(simT * 7 + f.ph);
    lPool(dlx, f.x, f.y, DZ, 2.4, '#ff3018', 0.6 * fl); lPool(lx, f.x, f.y, DZ, 2.4, '#ff3018', 0.4 * fl);
  }
  for (const L of [lx, dlx]) { L.globalAlpha = 1; L.globalCompositeOperation = 'source-over'; L.setTransform(1, 0, 0, 1, 0, 0); }

  // --- compose ground
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  ctx.drawImage(groundC, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(lightC, 0, 0, VW, VH);
  ctx.globalCompositeOperation = 'source-over';

  // --- objects in three bands: behind deck, deck, in front of deck
  const fs = fontPx();
  const behind = [], front = [], deck = [];
  for (const o of statics) (o.layer ? deck : (o.y1 <= DY1 + 0.01 && (o.y0 + o.y1) / 2 < DY1) ? behind : front).push(o);
  for (const c of cars) {
    c.x0 = c.x - 0.4; c.x1 = c.x + 0.4; c.y0 = c.y - 0.4; c.y1 = c.y + 0.4;
    (c.layer ? deck : c.y < DY1 ? behind : front).push(c);
  }
  const drawBand = list => {
    list.sort(depthCmp);
    for (const o of list) { if (o.route) drawCar(o, fs); else drawStatic(o, fs); }
    ctx.globalCompositeOperation = 'lighter';
    for (const o of list) { if (o.route) carGlow(o); else glowStatic(o); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  };
  drawBand(behind);
  // deck: lit by its own light buffer, masked to its own shape
  tx.setTransform(1, 0, 0, 1, 0, 0); tx.globalCompositeOperation = 'source-over'; tx.globalAlpha = 1;
  tx.clearRect(0, 0, VW, VH);
  tx.drawImage(deckC, 0, 0);
  tx.globalCompositeOperation = 'multiply'; tx.drawImage(dlightC, 0, 0, VW, VH);
  tx.globalCompositeOperation = 'destination-in'; tx.drawImage(deckC, 0, 0);
  tx.globalCompositeOperation = 'source-over';
  ctx.drawImage(tmpC, 0, 0);
  drawBand(deck);
  ctx.globalCompositeOperation = 'lighter';
  for (const inc of incidents) for (const f of inc.flares) {
    const fl = 0.7 + 0.3 * Math.sin(simT * 23 + f.ph);
    glowAt(f.x, f.y, DZ + 0.15, 4 * cam.zoom, '#ff4a20', fl); glowAt(f.x, f.y, DZ + 0.15, 12 * cam.zoom, '#ff3018', 0.3 * fl);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBand(front);

  // --- rain lit by every light, then haze
  drawRain();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.95; ctx.drawImage(rainC, 0, 0, VW, VH);
  ctx.globalAlpha = WEATHER[wi].haze; ctx.drawImage(lightC, 0, 0, VW, VH);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (flash > 0.02) { ctx.fillStyle = `rgba(190,205,255,${flash * 0.12})`; ctx.fillRect(0, 0, VW, VH); }
  ctx.drawImage(vigC, 0, 0);

  statT -= dt;
  if (statT <= 0) {
    statT = 0.5;
    const moving = cars.filter(c => !c.parked);
    const stopped = moving.filter(c => c.v < 0.5).length;
    statsEl.textContent = `${moving.length} cars · ${stopped} stopped · ${Math.round(fpsS)} fps`;
  }
  requestAnimationFrame(frame);
}

// ============================================================ input
const ptrs = new Map();
let pinch = null;
function camMoved(zoomed) { clampCam(); camDirty = true; if (zoomed) lastZoomChange = performance.now(); }
function zoomAt(px, py, f) {
  const nz = clamp(cam.zoom * f, 0.6, 4.5); f = nz / cam.zoom;
  cam.ox = px - (px - cam.ox) * f; cam.oy = py - (py - cam.oy) * f; cam.zoom = nz;
}
view.addEventListener('pointerdown', e => { view.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); pinch = null; });
view.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 1) { cam.ox += e.clientX - p.x; cam.oy += e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; camMoved(false); return; }
  p.x = e.clientX; p.y = e.clientY;
  const [a, b] = [...ptrs.values()];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, d = Math.hypot(a.x - b.x, a.y - b.y);
  if (pinch) { cam.ox += mx - pinch.mx; cam.oy += my - pinch.my; zoomAt(mx, my, d / Math.max(1, pinch.d)); camMoved(true); }
  pinch = { mx, my, d };
});
const up = e => { ptrs.delete(e.pointerId); pinch = null; };
view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
view.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); camMoved(true); }, { passive: false });
addEventListener('resize', resize);

const $ = id => document.getElementById(id);
$('bRain').onclick = () => { wi = (wi + 1) % WEATHER.length; $('vRain').textContent = WEATHER[wi].name; setRainCount(); };
$('bTraffic').onclick = () => { ti = (ti + 1) % TRAFFIC.length; $('vTraffic').textContent = TRAFFIC[ti].name; };
$('bBrake').onclick = () => {
  const fw = cars.filter(c => c.layer && c.route.cls === 'fwy' && c.x > 14 && c.x < 50 && !c.crash);
  fw.sort((a, b) => b.v - a.v).slice(0, 2).forEach(c => c.brakeT = 1.6);
};
$('bCrash').onclick = triggerCrash;
$('bView').onclick = () => { cam.zoom = defaultZoom(); centerOn(36, 37); camMoved(true); };
const defaultZoom = () => clamp(Math.max(W / 300, H / 480), 1.1, 2.4);

// ============================================================ boot
resize();
cam.zoom = defaultZoom();
centerOn(36, 37);
booted = true;
camDirty = true;
// warm up traffic so the first frame already looks lived-in
for (let k = 0; k < 900; k++) { simT += 1 / 30; trySpawn(); trySpawn(); updateCars(1 / 30); }
if (document.fonts && document.fonts.load) {
  document.fonts.load(`500 12px "JetBrains Mono"`).then(() => {
    atlas.clear();
    for (const b of buildings) b.cz = -1;
    camDirty = true;
  }).catch(() => {});
}
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
